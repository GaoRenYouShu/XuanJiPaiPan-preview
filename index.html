/* 今日行的字段来源有两处：今日表（assets/lunar-today.js）与外部库 lunar.js。

const GAN='甲乙丙丁戊己庚辛壬癸', ZHI='子丑寅卯辰巳午未申酉戌亥';
function timeGzOf(dayGz,h){
  /* 五鼠遁：时干序 = 日干序乘二加时支序，取十之模；时支按两小时一辰 */
  const di=GAN.indexOf(dayGz[0]), zi=Math.floor((h+1)/2)%12;
  return GAN[(di*2+zi)%10]+ZHI[zi];
}
function fieldsOfLunar(lunar,solar){
  return {ygz:lunar.getYearInGanZhi(),mc:lunar.getMonthInChinese(),dc:lunar.getDayInChinese(),
    mgz:lunar.getMonthInGanZhi(),dgz:lunar.getDayInGanZhi(),tgz:lunar.getTimeInGanZhi(),
    sx:lunar.getYearShengXiao(),jq:lunar.getJieQi()||'',
    yx:(lunar.getYueXiang?lunar.getYueXiang():'')||'',m:solar.getMonth(),d:solar.getDay()};
}
function fieldsOfTable(now){
  const T=window.LUNAR_TODAY;
  if(!T||T.year!==now.getFullYear())return null;
  const idx=Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(T.year,0,1))/86400000);
  if(idx<0||idx>=T.days.length)return null;
  const a=T.days[idx].split('|');
  return {ygz:a[0],mc:a[1],dc:a[2],mgz:a[3],dgz:a[4],tgz:timeGzOf(a[4],now.getHours()),
    sx:a[5],jq:a[6],yx:a[7],m:now.getMonth()+1,d:now.getDate()};
}

  const XZ=['白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯','水瓶','双鱼'];
  const cut=[20,19,21,20,21,22,23,23,23,24,23,22];
  const xzIdx=(f.d<cut[f.m-1])?(f.m+8)%12:(f.m+9)%12;
  const parts=[f.sx+'年 '+XZ[xzIdx]+'座','月建 '+(f.mgz[1]||'')+'月'];
  if(f.yx&&f.yx!=='—')parts.push('月相 '+f.yx);
  if(f.jq)parts.push('今日'+f.jq);
  document.getElementById('tExtra').textContent=parts.join('　');
}
window.fillToday=function(){
  const now=new Date();
  let f=fieldsOfTable(now);
  if(f){ renderToday(f); return; }
  if(!window.Solar){ fillTodayFromLibrary(); return; }
  renderToday(fieldsOfLunar(Solar.fromDate(now).getLunar(),Solar.fromDate(now)));
};
window.fillTodayFromLibrary=function(){
  if(window.__lunarLoading)return;
  window.__lunarLoading=true;
  const s=document.createElement('script');
  s.src='assets/lunar.js';
  s.onload=function(){ window.fillToday&&window.fillToday(); };
  document.head.appendChild(s);
}


window.addEventListener('load', function () {
  setTimeout(function () {
    document.getElementById('cats').innerHTML=CATS.map((c,i)=>{
      const rows=c.tools.map(t=>{
        idx++;
        const no=String(idx).padStart(2,'0');
        return `<li><a class="hm-tool" href="${t[0]}">
          <span class="hm-idx">${no}</span>
          <span class="hm-nm">${t[1]}</span>
          <span class="hm-line"></span>
          <span class="hm-de">${t[2]}</span>
        </a></li>`;
      }).join('');
      return `<section class="hm-cat">
        <h2 class="hm-cat-h">
          <span class="num">${CN_NUM[i]}</span>
          <span class="nm">${c.nm}</span>
          <span class="en">${c.en}</span>
          <span class="cnt">${c.tools.length} 目</span>
        </h2>
        <ul class="hm-list">${rows}</ul>
      </section>`;
    }).join('');
  }, 0);
});
</script>
